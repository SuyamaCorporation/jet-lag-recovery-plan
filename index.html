<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時差ボケ回復プランナー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-cyan-400 mb-1">✈️ 時差ボケ回復プランナー</h1>
  <p class="text-gray-400 text-sm mb-6">出発地・到着地の時差と到着日時を入力して回復スケジュールを生成します</p>

  <div class="bg-gray-900 rounded-xl p-4 mb-4">
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="text-xs text-gray-400 block mb-1" for="depTz">出発地 時差 (UTC+)</label>
        <select id="depTz" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 w-full text-sm focus:outline-none focus:border-cyan-400" aria-label="出発地タイムゾーン">
          <option value="-12">UTC-12</option><option value="-11">UTC-11</option><option value="-10">UTC-10</option>
          <option value="-9">UTC-9</option><option value="-8">UTC-8 (LA)</option><option value="-7">UTC-7</option>
          <option value="-6">UTC-6</option><option value="-5">UTC-5 (NY)</option><option value="-4">UTC-4</option>
          <option value="-3">UTC-3</option><option value="-2">UTC-2</option><option value="-1">UTC-1</option>
          <option value="0">UTC+0 (London)</option><option value="1">UTC+1</option><option value="2">UTC+2</option>
          <option value="3">UTC+3</option><option value="4">UTC+4</option><option value="5">UTC+5</option>
          <option value="5.5">UTC+5:30 (India)</option><option value="6">UTC+6</option><option value="7">UTC+7</option>
          <option value="8">UTC+8 (Beijing)</option><option value="9" selected>UTC+9 (Tokyo)</option>
          <option value="10">UTC+10 (Sydney)</option><option value="11">UTC+11</option><option value="12">UTC+12</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-400 block mb-1" for="arrTz">到着地 時差 (UTC+)</label>
        <select id="arrTz" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 w-full text-sm focus:outline-none focus:border-cyan-400" aria-label="到着地タイムゾーン">
          <option value="-12">UTC-12</option><option value="-11">UTC-11</option><option value="-10">UTC-10</option>
          <option value="-9">UTC-9</option><option value="-8">UTC-8 (LA)</option><option value="-7">UTC-7</option>
          <option value="-6">UTC-6</option><option value="-5" selected>UTC-5 (NY)</option><option value="-4">UTC-4</option>
          <option value="-3">UTC-3</option><option value="-2">UTC-2</option><option value="-1">UTC-1</option>
          <option value="0">UTC+0 (London)</option><option value="1">UTC+1</option><option value="2">UTC+2</option>
          <option value="3">UTC+3</option><option value="4">UTC+4</option><option value="5">UTC+5</option>
          <option value="5.5">UTC+5:30 (India)</option><option value="6">UTC+6</option><option value="7">UTC+7</option>
          <option value="8">UTC+8 (Beijing)</option><option value="9">UTC+9 (Tokyo)</option>
          <option value="10">UTC+10 (Sydney)</option><option value="11">UTC+11</option><option value="12">UTC+12</option>
        </select>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="text-xs text-gray-400 block mb-1" for="arrDate">到着日</label>
        <input id="arrDate" type="date" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 w-full text-sm focus:outline-none focus:border-cyan-400" aria-label="到着日">
      </div>
      <div>
        <label class="text-xs text-gray-400 block mb-1" for="arrTime">到着時刻（現地時間）</label>
        <input id="arrTime" type="time" value="14:00" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 w-full text-sm focus:outline-none focus:border-cyan-400" aria-label="到着時刻">
      </div>
    </div>
    <button id="generateBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded transition-colors" aria-label="回復プランを生成">回復プランを生成</button>
  </div>

  <div id="result" class="hidden">
    <div id="summaryBox" class="bg-gray-900 rounded-xl p-4 mb-4">
      <div class="grid grid-cols-3 gap-3 text-center">
        <div class="bg-gray-800 rounded-lg p-3">
          <div class="text-xs text-gray-400 mb-1">時差</div>
          <div id="diffDisplay" class="text-2xl font-bold text-cyan-400"></div>
        </div>
        <div class="bg-gray-800 rounded-lg p-3">
          <div class="text-xs text-gray-400 mb-1">方向</div>
          <div id="dirDisplay" class="text-2xl font-bold text-yellow-400"></div>
        </div>
        <div class="bg-gray-800 rounded-lg p-3">
          <div class="text-xs text-gray-400 mb-1">回復日数</div>
          <div id="daysDisplay" class="text-2xl font-bold text-green-400"></div>
        </div>
      </div>
    </div>

    <div class="bg-gray-900 rounded-xl p-4">
      <h2 class="text-sm font-semibold text-gray-300 mb-3">日別回復スケジュール</h2>
      <div id="schedule" class="space-y-3"></div>
    </div>
  </div>
</div>

<script>
const today = new Date();
document.getElementById('arrDate').value = today.toISOString().split('T')[0];

document.getElementById('generateBtn').addEventListener('click', generate);

function generate() {
  const depTz = parseFloat(document.getElementById('depTz').value);
  const arrTz = parseFloat(document.getElementById('arrTz').value);
  const arrDate = document.getElementById('arrDate').value;
  const arrTime = document.getElementById('arrTime').value;
  if (!arrDate) return;

  const diff = arrTz - depTz; // positive = traveled east
  const absDiff = Math.abs(diff);
  const direction = diff > 0 ? '東向き' : diff < 0 ? '西向き' : '同方向';
  const recoveryDays = Math.ceil(absDiff * (diff > 0 ? 1.5 : 1)); // east harder
  const adjustPerDay = diff > 0 ? 1.5 : 2; // h per day: east 1.5h, west 2h

  document.getElementById('diffDisplay').textContent = `${diff > 0 ? '+' : ''}${diff}h`;
  document.getElementById('dirDisplay').textContent = direction;
  document.getElementById('daysDisplay').textContent = `${recoveryDays}日`;

  const [ah, am] = arrTime.split(':').map(Number);
  const arrBaseDate = new Date(arrDate);

  const schedule = document.getElementById('schedule');
  schedule.innerHTML = '';

  for (let day = 0; day <= recoveryDays; day++) {
    const d = new Date(arrBaseDate);
    d.setDate(d.getDate() + day);
    const label = day === 0 ? '到着日' : `Day ${day}`;
    const ratio = day / recoveryDays;

    // Sleep window shifts gradually back to local normal (23:00 sleep)
    // On arrival, body expects home sleep time
    const homeSleepH = 23; // normal sleep time
    const bodyOffsetH = -diff; // body clock offset from local
    const currentBodySleep = homeSleepH + bodyOffsetH * (1 - ratio);
    const sleepH = Math.round(Math.min(Math.max(currentBodySleep, 21), 27)) % 24;
    const wakeH = (sleepH + 8) % 24;

    // Light exposure: east travel = morning light; west = evening light
    const lightH = diff > 0 ? Math.max(6, wakeH) : Math.min(20, sleepH - 3);
    const melatoninH = (sleepH - 2 + 24) % 24;

    const dateStr = d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
    const tag = day === 0 ? 'bg-cyan-900 border border-cyan-700' : day === recoveryDays ? 'bg-green-900 border border-green-700' : 'bg-gray-800';

    schedule.innerHTML += `
      <div class="${tag} rounded-lg p-3">
        <div class="flex justify-between items-center mb-2">
          <span class="font-semibold text-sm">${label}: ${dateStr}</span>
          ${day === recoveryDays ? '<span class="text-xs text-green-400">回復完了目標</span>' : ''}
        </div>
        <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🌙</span>
            <div>
              <div class="text-gray-400">就寝目標</div>
              <div class="font-mono">${String(sleepH).padStart(2,'0')}:00</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-2xl">⏰</span>
            <div>
              <div class="text-gray-400">起床目標</div>
              <div class="font-mono">${String(wakeH).padStart(2,'0')}:00</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-2xl">☀️</span>
            <div>
              <div class="text-gray-400">光照射時間</div>
              <div class="font-mono">${String(lightH).padStart(2,'0')}:00〜${String((lightH+2)%24).padStart(2,'0')}:00</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-2xl">💊</span>
            <div>
              <div class="text-gray-400">メラトニン目安</div>
              <div class="font-mono">${String(melatoninH).padStart(2,'0')}:00頃</div>
            </div>
          </div>
        </div>
        <div class="mt-2 text-xs text-gray-400">
          ${day === 0 ? '到着日: 現地時刻に合わせて無理に起きている。昼寝は20分以内。' :
            diff > 0 ? `朝に強い光を浴び、夜は暗くする。体内時計を${adjustPerDay}時間/日ペースで前進調整。` :
            `夕方に光を浴び、朝は遮光カーテン活用。体内時計を${adjustPerDay}時間/日ペースで後退調整。`}
        </div>
      </div>
    `;
  }

  document.getElementById('result').classList.remove('hidden');
}
</script>
</body>
</html>
